<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 公開先のルート(https://uraraworks.github.io/Sprout68k/)に来た人を紹介ページへ送る。
       アプリ本体は ide/ 配下にあるため、ここに何も置かないと 404 になる。
       JavaScript を切っていても動くよう meta refresh と素のリンクの両方を置く。 -->
  <meta http-equiv="refresh" content="0; url=./ide/about.html">
  <link rel="canonical" href="./ide/about.html">
  <link rel="icon" href="./ide/icons/sprout68k.svg" type="image/svg+xml">
  <title>Sprout68k</title>
  <!-- SNS に貼ったときのカード。**これが無いと URL だけの寂しいリンクになる。**
       og:image は tools/ogp/build_card.py が作る（作例の画面写真を含むので、
       作例を直したら作り直す）。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sprout68k">
  <meta property="og:title" content="Sprout68k">
  <meta property="og:description" content="ブラウザだけで X68000 のプログラムを C で書いて、すぐ動かせる入門環境。インストール不要。作ったものは URL で配れます。">
  <meta property="og:url" content="https://uraraworks.github.io/Sprout68k/">
  <meta property="og:image" content="https://uraraworks.github.io/Sprout68k/ide/icons/ogp-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #d1d5db; background: #1f1f1f; font: 15px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; text-align: center; }
    img { width: 64px; height: 64px; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <div>
    <img src="./ide/icons/sprout68k.svg" alt="" width="64" height="64">
    <h1>Sprout68k</h1>
    <p><a href="./ide/about.html">Sprout68k とは（紹介ページ）</a></p>
    <p><a href="./ide/index.html">はじめる / Start</a></p>
  </div>
</body>
</html>
