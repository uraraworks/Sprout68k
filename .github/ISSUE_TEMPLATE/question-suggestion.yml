name: 質問・提案
description: 使い方の質問や改善提案を送る
title: "[質問・提案] "
body:
  - type: markdown
    attributes:
      value: |
        ## 投稿前に必ず確認してください
        **判定基準は「エミュレータや実機で自分で測れば同じ結果が得られる種類の情報か」です。**

        逆アセンブル結果、ROM・Human68k・市販ソフトの内部情報、非公開資料、第三者の著作物は受け取りません。該当する投稿は、情報を読んだ時点で手遅れになるため本文を読まずにクローズします。詳しくは [CONTRIBUTING.md](../../CONTRIBUTING.md) を確認してください。
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 質問
        - 改善提案
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 内容
      description: 質問または提案を具体的に書いてください。観測した事実がある場合は再現手順も添えてください。
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 測定方法・公開資料の出典
      description: 実測した場合は測り方を、公開資料に基づく場合は資料名・URL・版・該当箇所を書いてください。
  - type: checkboxes
    id: information-policy
    attributes:
      label: 受け取りポリシーの確認
      options:
        - label: 逆アセンブル結果や ROM の内部情報、非公開情報、第三者の著作物を含んでいません。
          required: true
