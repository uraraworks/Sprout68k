name: Deploy X68kDev to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_base_url:
        description: "wasm-tools Release asset base URL (tag directory)"
        required: true
        type: string
      manifest_sha256:
        description: "x68kdev-wasm-tools-v1.manifest.json SHA-256"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Vite
        run: npm install --no-save --ignore-scripts vite@5.4.21
      - name: Fetch and verify wasm tools Release
        env:
          RELEASE_BASE_URL: ${{ inputs.release_base_url }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: >-
          node tools/fetch_wasm_release.mts
          --source "$RELEASE_BASE_URL"
          --manifest-sha256 "$RELEASE_MANIFEST_SHA256"
          --output build/wasm-tools
      - name: Build Pages artifact
        run: npm run build
      - name: Verify published file set
        run: node tools/verify_distribution.mts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-page
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
